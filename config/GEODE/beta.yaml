common:
  img_topic: "/left_camera/image"
  lid_topic: "/ouster/points"
  imu_topic: "/imu/data"
  img_en: 1
  enable_img_sync_in_lio: false
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # lidar to imu
  extrinsic_T: [-0.027172000000, -0.034873000000, 0.062643000000]
  extrinsic_R: [0.998638000000, 0.052001000000, -0.004278000000,
                -0.051937000000, 0.998554000000, 0.013900000000,
                0.004994000000, -0.013659000000, 0.999894000000]
  # lidar to left_cam
  Rcl: [0.004932897860, -0.999986845320, 0.001405597730,
        -0.007798013401, -0.001444039327, -0.999968552374,
        0.999957427847, 0.004921781862, -0.007805034120]
  Pcl: [-0.072726081157, -0.015546673204, -0.127972763301]

 # lidar to right_cam
  # Rcl: [-0.000391777666, -0.999998607067, -0.001622459536,
  #       -0.014129635270, 0.001627833361, -0.999898846667,
  #       0.999900094968, -0.000368813275, -0.014130253337]
  # Pcl: [-0.034542070945, -0.038084597676, 0.092540466870]

time_offset:
  lidar_time_offset: 0.0
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 3
  filter_size_surf: 0.1
  lidar_type: 3 # Ouster
  scan_line: 128
  blind: 1.0

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  # acc_cov: 1.1118983704388789e-02
  # gyr_cov: 9.6134865171113148e-03
  # b_acc_cov: 1.5961182793700285e-04
  # b_gyr_cov: 7.9993782046705285e-05
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.01
  min_eigen_value: 0.0025 # 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "geode_beta"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1
