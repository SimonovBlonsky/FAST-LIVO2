common:
  img_topic: "/left_camera"
  lid_topic: "/velodyne_points"
  imu_topic: "/imu/data"
  img_en: 1
  enable_img_sync_in_lio: false
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # lidar to imu
  extrinsic_T: [0.010965000000, -0.086864000000, 0.060426000000]
  extrinsic_R: [0.998989200000, 0.044487000000, -0.006440600000,
                -0.044635300000, 0.998688500000, -0.025078900000,
                0.005316400000, 0.025341000000, 0.999664700000]
  # lidar to left_cam
  Rcl: [0.015753553148, -0.999845585365, -0.007786590332,
        -0.000763581852, 0.007775524202, -0.999969478617,
        0.999875613517, 0.015759018026, -0.000640971810]
  Pcl: [-0.148302939856, -0.112321962322, -0.205047197543]

 # lidar to right_cam
  # Rcl: [0.016912636181, -0.999834178240, -0.006751204349,
  #       -0.009021893309, 0.006599292877, -0.999937525436,
  #       0.999816267210, 0.016972488217, -0.008908785843]
  # Pcl: [-0.102624501977, -0.114132653836, 0.171206432080]

time_offset:
  lidar_time_offset: 0.0
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 3
  filter_size_surf: 0.1
  lidar_type: 2 # Velodyne
  scan_line: 16
  blind: 1.0

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  # acc_cov: 1.0481546278947311e-02
  # gyr_cov: 9.6690835928856730e-03
  # b_acc_cov: 1.8451561389195461e-04
  # b_gyr_cov: 8.2887875865635737e-05
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.01
  min_eigen_value: 0.0025 # 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "geode_alpha"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1
