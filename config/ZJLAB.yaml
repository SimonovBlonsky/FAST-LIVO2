common:
  img_topic: "/apollo/sensor/drivers/camera/surround_camera/front/compress"
  lid_topic: "/hesai/pandar"
  imu_topic: "raw_imu"
  img_en: 1
  enable_img_sync_in_lio: false
  lidar_en: 1
  ros_driver_bug_fix: false

# extrinsics: LiDAR w.r.t IMU frame

extrin_calib:
  extrinsic_T: [0,0,0]
  extrinsic_R: [1,0,0, 
                0,1,0, 
                0,0,1]
# extrin_calib:
#   extrinsic_T: [ 0.284350, -0.295376, 0.834590]
#   extrinsic_R: [ 0.867826, -0.495814, -0.032357, 
#                 0.496236, 0.868166, 0.006124, 
#                 0.025055, -0.021371, 0.999458]
  # NTU_VIRAL
  # Rcl: LiDAR w.r.t Camera frame, L2C
  # Rcl: [1,0,0,
  #       0,1,0,
  #       0,0,1]
  # Pcl: [0,0,0]
  

  # 手动标定
  Rcl: [0.887356, -0.461023, 0.00755961,
        -0.00083282, -0.0179978, -0.999838,
        0.461085, 0.887205, -0.0163546]
  Pcl: [-0.0139692, -0.112193, -0.14131]

  # [0.889651, -0.456329, 0.0168765,
  #       0.0128356, -0.0119535, -0.999846,
  #       0.456461, 0.88973, -0.00477735]
  # Pcl: [-0.0315008,  -0.137635, -0.172611]

time_offset:
  lidar_time_offset: -0.1
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 3
  filter_size_surf: 0.1
  lidar_type: 7 # Hesai PandarP40
  scan_line: 40
  blind: 1.0

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.01
  min_eigen_value: 0.0025 # 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "eee_01"
  pose_output_en: true

pcd_save:
  pcd_save_en: true
  colmap_output_en: true # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
