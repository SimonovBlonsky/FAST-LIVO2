common:
  img_topic: "/stereo/frame_left/image_raw"
  lid_topic: "/os_cloud_node/points"
  imu_topic: "/stim300/imu/data_raw"
  img_en: 1
  enable_img_sync_in_lio: false
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # lidar to imu
  extrinsic_T: [0.035956798, -0.017640442, 0.032917638]
  extrinsic_R: [0.999958590, 0.008307471, 0.003715439,
                -0.008312361, 0.999964603, 0.001302572,
                -0.003704486, -0.001333402, 0.999992249]
  # lidar to rgb_cam
  Rcl: [-0.007245604, -0.999750758, -0.021116903,
        0.005176599, 0.021079674, -0.999764397,
        0.999960351, -0.007353211, 0.005022574]
  Pcl: [0.080962787, -0.054115977, -0.038534767]

time_offset:
  lidar_time_offset: 0.0
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 3
  filter_size_surf: 0.1
  lidar_type: 3 # Ouster
  scan_line: 128
  blind: 1.0

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.01
  min_eigen_value: 0.0025 # 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "fusionportable_legged"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1
